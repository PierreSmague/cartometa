[project]
name = "cartometa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "selectolax>=0.4.11",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cartometa-extract = "cartometa.extract.cli:main"
cartometa-review = "cartometa.review.server:main"
cartometa-build = "cartometa.build.cli:main"

[tool.pytest.ini_options]
markers = ["real_data: nécessite data/geo/, sauté si absent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartometa"]
