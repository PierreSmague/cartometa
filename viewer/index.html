<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartometa — GeoGuessr metas by area</title>
  <meta name="description" content="Find all relevant metas from your GeoGuessr round in an instant!">
  <link rel="canonical" href="__SITE_URL__/">
  <link rel="icon" type="image/svg+xml" href="__ICON_SVG__">
  <link rel="icon" type="image/png" sizes="32x32" href="__ICON_PNG__">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cartometa">
  <meta property="og:title" content="Cartometa — GeoGuessr metas by area">
  <meta property="og:description" content="Find all relevant metas from your GeoGuessr round in an instant!">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/__OG_IMAGE__">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Cartometa map, with a highlighted area in South Africa and a gallery of meta hint photographs.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Empreintes SHA-384 verifiees identiques sur unpkg, jsdelivr et cdnjs le
       2026-08-03 : le navigateur refusera d'executer un fichier altere. A
       recalculer si la version de Leaflet change, sinon la carte disparait
       sans message. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="__CSS__">
  <script defer type="module" src="__JS__"></script>
</head>
<body>
  <header id="entete">
    <div class="marque">
      <span class="nom">Cartometa</span>
      <span class="baseline">GeoGuessr metas, by area</span>
    </div>
    <span id="compteurs" class="compteurs"></span>
  </header>

  <main id="principal">
    <div id="carte"></div>
    <section id="panneau">
      <div id="filtres" hidden>
        <button class="pastille active" data-categorie="">All</button>
        <button class="pastille" data-categorie="poteaux">Poles</button>
        <button class="pastille" data-categorie="bollards">Bollards</button>
        <button class="pastille" data-categorie="signalisation">Signs</button>
        <button class="pastille" data-categorie="vegetation">Vegetation</button>
        <button class="pastille" data-categorie="vehicule">Vehicle</button>
        <button class="pastille" data-categorie="autre">Other</button>
        <input id="recherche" type="search" placeholder="Filter these results…">
      </div>
      <div id="accueil">
        <h1>Click anywhere on the map</h1>
        <p>
          You'll see every meta that covers that point, from the most
          specific to the most general.
        </p>
      </div>
      <div id="galerie"></div>
    </section>
  </main>

  <footer id="pied">
    Text and images © 2021-2026 Plonk It, CC BY-NC-SA 4.0 ·
    Imagery © Google · Basemap © OpenStreetMap ·
    <a href="licence.html">licence and attribution</a>
  </footer>

  <div id="loupe" hidden>
    <button id="loupe-fermer" aria-label="Close">×</button>
    <img id="loupe-image" alt="">
    <p id="loupe-texte"></p>
  </div>
</body>
</html>
