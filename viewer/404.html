<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartometa — page not found</title>
  <!-- An error page must not enter an index, and has no canonical: it is served
       under whatever address was requested, not under an address of its own. -->
  <meta name="robots" content="noindex">
  <!-- ABSOLUTE PATHS ARE MANDATORY, unlike on the other two pages. The
       placeholders are replaced by BARE file names (`style.a1b2c3d4.css`).
       Cloudflare serves this page under the requested URL: on `/a/b/c`, a relative
       path would resolve to `/a/b/style.a1b2c3d4.css` and the page would arrive
       without styling, without an icon and with a broken back link. The leading
       slash is what prevents that. -->
  <link rel="icon" type="image/svg+xml" href="/__ICON_SVG__">
  <link rel="icon" type="image/png" sizes="32x32" href="/__ICON_PNG__">
  <link rel="stylesheet" href="/__CSS__">
  <style>
    body { display: block; }
    main { max-width: 52ch; margin: 0 auto; padding: 80px 24px; }
    h1 { font-size: 22px; }
    p { color: #45453f; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>
      There is nothing at this address. It may have been mistyped, or it may
      point at something this site no longer publishes.
    </p>
    <p><a href="/">← back to the map</a></p>
  </main>
</body>
</html>
