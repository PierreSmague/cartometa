<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cartometa - review</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; }
    header { display: flex; gap: 16px; align-items: center; padding: 8px 12px;
             background: #1c1f24; color: #fff; }
    header b { font-size: 16px; }
    #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
    /* Heights are capped so that the RMRG mini-map (800x1158, very tall at
       full column width) and the photo stay visible together without
       scrolling away from the tracing map. The mini-map comes first: it is
       what the reviewer traces from. */
    #source img { display: block; width: auto; max-width: 100%; max-height: 30vh;
                  border: 1px solid #ccc; margin-bottom: 8px; }
    #source #overlay { max-height: 48vh; }
    #map { height: 62vh; border: 1px solid #ccc; }
    #info { padding: 8px 12px; }
    #sketch-row { color: #0a7d2b; font-weight: bold; }
    #sketch-row[hidden] { display: none; }
    /* Explicit `color`: without it, kbd inherits the header's white and becomes
       unreadable on its own light background. */
    kbd { background: #eee; color: #111; border-radius: 3px; padding: 1px 5px;
          border: 1px solid #bbb; }
    #error { background: #b00020; color: #fff; padding: 8px 12px; font-weight: bold; }
    #error[hidden] { display: none; }
    #manual { position: fixed; inset: 10% 25%; background: #fff; border: 2px solid #1c1f24;
              padding: 16px; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,.4); z-index: 1000; }
    #manual[hidden] { display: none; }
    #manual label { display: block; margin: 8px 0 2px; font-weight: bold; }
    #manual input[type=text], #manual textarea, #manual select { width: 100%; font: inherit; }
    #manual textarea { height: 5em; }
    #drop { border: 2px dashed #999; padding: 24px; text-align: center; color: #666;
            margin-top: 8px; }
    #drop.filled { border-color: #0a7d2b; color: #0a7d2b; }
    #drop img { max-height: 120px; display: block; margin: 8px auto 0; }
    #manual-error { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <b id="progress">…</b>
    <span id="context"></span>
    <span style="margin-left:auto">
      <kbd>D</kbd> rectangle <kbd>C</kbd> outline <kbd>Enter</kbd> close the outline
      <kbd>S</kbd> subdivisions <kbd>E</kbd> country <kbd>F</kbd> clip
      <kbd>⌫</kbd> remove <kbd>0</kbd> empty
      <kbd>A</kbd> save <kbd>R</kbd> reject <kbd>Space</kbd> next
      <kbd>U</kbd> undo <kbd>N</kbd> new meta <kbd>M</kbd> edit texts
      <kbd>Ctrl+V</kbd> image
    </span>
  </header>
  <div id="error" hidden></div>
  <div id="panes">
    <div id="source"><img id="overlay" alt="" hidden><img id="image" alt=""></div>
    <div id="map"></div>
  </div>
  <div id="info">
    <h2 id="title"></h2>
    <p id="description"></p>
    <p id="sketch-row" hidden></p>
    <a id="source-link" target="_blank" rel="noopener">source</a>
  </div>

  <div id="manual" hidden>
    <h3 id="manual-heading">New meta</h3>
    <label for="manual-title">Title</label>
    <input id="manual-title" type="text">
    <label for="manual-description">Description</label>
    <textarea id="manual-description"></textarea>
    <label for="manual-category">Category</label>
    <select id="manual-category">
      <option value="infrastructure">infrastructure</option>
      <option value="vegetation">vegetation</option>
      <option value="landscape">landscape</option>
      <option value="architecture">architecture</option>
      <option value="car">car</option>
      <option value="culture">culture</option>
      <option value="autre" selected>autre</option>
    </select>
    <!-- Empty value first, and selected by default: a meta nobody has judged carries
         no difficulty at all, and that has to stay reachable to clear one. -->
    <label for="manual-difficulty">Difficulty</label>
    <select id="manual-difficulty">
      <option value="" selected>not rated</option>
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Pro">Pro</option>
    </select>
    <label for="manual-source">Source (URL, optional)</label>
    <input id="manual-source" type="text">
    <div id="drop">Drop an image here, or paste it with Ctrl+V</div>
    <p id="manual-error"></p>
    <p>
      <button id="manual-save" type="button">Create</button>
      <button id="manual-cancel" type="button">Cancel (Escape)</button>
    </p>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
